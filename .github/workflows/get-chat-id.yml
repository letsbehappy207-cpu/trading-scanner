name: Get Telegram Chat ID (one-off helper)

on:
  workflow_dispatch: {}

jobs:
  get-chat-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch getUpdates and print chat id(s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python get_chat_id.py
